version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: smte_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: smart_money_engine
      POSTGRES_USER: smte_admin
      POSTGRES_PASSWORD: Kinzi@0023
    ports:
      - "5433:5432"
    volumes:
      - smte_pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: smte_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@smte.com
      PGADMIN_DEFAULT_PASSWORD: Kinzi@0023
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  smte_pgdata: